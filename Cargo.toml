[package]
name = "nu_plugin_strutils"
version = "0.25.0"
authors = ["Darren Schroeder"]
edition = "2024"
description = "a collection of string utilities for nushell"
license = "MIT"
repository = "https://github.com/fdncred/nu_plugin_strutils"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# nushell dependencies
nu-plugin = "0.116.1"
nu-protocol = "0.116.1"
nu-path = "0.116.1"

# for local development, you can use a path dependency
# nu-plugin = { path = "../nushell/crates/nu-plugin", version = "0.98.0" }
# nu-protocol = { path = "../nushell/crates/nu-protocol", version = "0.98.0" }
# nu-path = { path = "../nushell/crates/nu-path", version = "0.98.0" }

deunicode = "1.6.2"
textdistance = "1.1.1"
brotli = "9.0.0"
textwrap = { version = "0.16.4", features = ["hyphenation", "unicode-width", "unicode-linebreak", "smawk"] }
flate2 = "1.1.10"
slug = "0.1.6"
shell-words = "1.1.1"
unicode-truncate = "3.0.0"
tabwriter = "1.4.1"
unescaper = "0.2.0"

[dev-dependencies]
nu-plugin-test-support = "0.116.1"
# Enable local-socket on the engine so its match of ServerCommunicationIo
# stays exhaustive when nu-plugin (default features) turns the variant on.
nu-plugin-engine = { version = "0.116.1", features = ["local-socket"] }
# nu-plugin-test-support = { path = "../nushell/crates/nu-plugin-test-support" }

[profile.release]
opt-level = "s"     # Optimize for size
strip = "debuginfo"
lto = "thin"

[profile.dev]
opt-level = 0

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
